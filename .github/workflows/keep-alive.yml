name: Keep Backend Alive

on:
  schedule:
    - cron: "*/13 * * * *"   # every 13 minutes, safely under Render's 15-min sleep timer
  workflow_dispatch:          # allows manual trigger from the Actions tab for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl -sf https://guardian-ai-backend.onrender.com/ || echo "Ping failed, Guardian.AI backend may be cold-starting"
