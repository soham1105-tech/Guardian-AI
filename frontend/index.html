<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile / Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Typography: Inter (system fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO -->
    <title>Guardian.AI — Threat Investigation</title>

    <meta
      name="description"
      content="Guardian.AI investigates suspicious emails and links with deterministic checks and an explainable AI verdict."
    />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#08080B" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Guardian.AI — Threat Investigation" />
    <meta
      property="og:description"
      content="Check before you click. Investigate suspicious emails and links with deterministic checks and an explainable AI verdict."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:site_name" content="Guardian.AI" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guardian.AI — Threat Investigation" />
    <meta
      name="twitter:description"
      content="Investigate suspicious emails and links with deterministic checks and an explainable AI verdict."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://your-domain.com/" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
